# A plain reverse proxy, as a hosting platform would put in front of the app.
# proxy_buffering is left at nginx's default (on): the app's `X-Accel-Buffering: no`
# header is what turns buffering off for the SSE stream only.
server {
    listen 80;
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;          # keep-alive to the upstream; needed for streaming
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;           # a replay can run for a long time
    }
}
