# CI: lint -> tests inside the image's environment -> build the runtime image and
# smoke-test it -> (main only) publish to GitHub Container Registry.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the publish step gets write access to packages
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.6
      - run: ruff check .

  test:
    # pytest runs inside the Docker `test` stage: the same OS, Python and locked
    # packages as the runtime image. A failing test fails the image build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          cache-from: type=gha,scope=fraud-ops
          cache-to: type=gha,scope=fraud-ops,mode=max

  image:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # The demo bundle is downloaded from the GitHub Release and checked against
      # the SHA-256 pinned in the Dockerfile.
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fraud-ops
          cache-to: type=gha,scope=fraud-ops,mode=max

      - name: Image size
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker image inspect "$IMAGE" --format '{{.Size}}' | awk '{printf "uncompressed image: %.0f MB\n", $1/1e6}'

      - name: Smoke test the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker run -d --name app -p 8000:8000 --memory 2g --read-only --tmpfs /tmp "$IMAGE"
          python3 scripts/smoke_test.py http://127.0.0.1:8000 --expect-vendored --wait 120
          docker stats --no-stream --format 'memory after smoke test: {{.MemUsage}}' app

      - name: Container logs
        if: failure()
        run: docker logs app || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "ghcr.io/${GITHUB_REPOSITORY,,}"

  sample:
    # The image Render's free plan runs: the sample bundle under a hard 512 MB limit.
    # Build args and runtime environment both come from render.yaml, as on Render.
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read render.yaml
        id: render
        run: |
          yq -r '.services[0].envVars[] | .key + "=" + .value' render.yaml > render.env
          grep -q '^BUNDLE_SHA256=[0-9a-f]\{64\}$' render.env
          grep -q '^PORT=10000$' render.env
          { echo 'args<<EOF_ARGS'; cat render.env; echo 'EOF_ARGS'; } >> "$GITHUB_OUTPUT"

      # Reads the layer cache but does not write it: the image job owns that scope
      - name: Build sample image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: fraud-ops:sample
          build-args: ${{ steps.render.outputs.args }}
          cache-from: type=gha,scope=fraud-ops

      # memory-swap = memory means no swap, so going over 512 MB kills the app
      - name: Smoke test in 512 MB
        run: |
          docker run -d --name app -p 10000:10000 --env-file render.env \
            --memory 512m --memory-swap 512m fraud-ops:sample
          python3 scripts/smoke_test.py http://127.0.0.1:10000 --expect-vendored --expect-sample --wait 120

      - name: Memory
        run: |
          docker exec app cat /sys/fs/cgroup/memory.peak | awk '{printf "peak memory: %.0f MiB of 512\n", $1/1048576}'
          docker exec app cat /sys/fs/cgroup/memory.events
          test "$(docker inspect app --format '{{.State.OOMKilled}} {{.RestartCount}}')" = "false 0"
          docker exec app grep -qx 'oom_kill 0' /sys/fs/cgroup/memory.events

      # Information only: the runner's CPU is not Render's, so slowness here does not fail CI
      - name: Smoke test at 0.1 CPU (informational)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          docker rm -f app
          docker run -d --name app -p 10000:10000 --env-file render.env --no-healthcheck \
            --memory 512m --memory-swap 512m --cpus 0.1 fraud-ops:sample
          python3 scripts/smoke_test.py http://127.0.0.1:10000 --expect-sample --wait 600
          docker exec app cat /sys/fs/cgroup/memory.peak | awk '{printf "peak memory: %.0f MiB of 512\n", $1/1048576}'

      - name: Container logs
        if: always()
        run: docker logs --tail 100 app || true
