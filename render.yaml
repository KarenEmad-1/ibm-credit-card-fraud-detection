# Render Blueprint for a free web service (512 MB RAM, 0.1 CPU). Not deployed: Render asked
# for a payment card, so the live demo is the static site on GitHub Pages. CI still uses
# this file to build and test the sample image.
#
# The full 2019 test year does not fit in 512 MB, so this builds the same Dockerfile
# with the sample bundle: January 2019 of the test year, plus January 2018 of the
# validation year (FRAUD_SPLITS=test,val), where the validation-only MLP appears.
# Render passes envVars both to the Docker build (as build args) and to the running container; CI's `sample` job reads this file and
# does the same, so what it tests is what Render runs.
services:
  - type: web
    name: fraud-ops-demo
    runtime: docker
    plan: free                        # explicit: Render's default plan is a paid one
    region: frankfurt                 # cannot be changed after the service is created
    branch: main
    autoDeployTrigger: checksPass     # deploy only commits whose CI passed
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: FRAUD_SPLITS
        value: test,val
      - key: BUNDLE_NAME
        value: fraud-ops-demo-sample-v2
      - key: BUNDLE_URL
        value: https://github.com/KarenEmad-1/ibm-credit-card-fraud-detection/releases/download/demo-data-v2/fraud-ops-demo-sample-v2.tar.gz
      - key: BUNDLE_SHA256
        value: 5e1de37aff68512f3e3e63860e266de604307a05a12c2362c9df5d32e942d13b
