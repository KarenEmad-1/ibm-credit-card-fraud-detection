# One-command local run:  docker compose up --build   ->  http://localhost:8000
#
# Builds the image (downloading the demo bundle from the GitHub Release, checksum-pinned)
# and runs it with the same settings as the hosted demo.
services:
  app:
    build:
      context: .
      target: runtime
    image: fraud-ops:local
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # The app holds ~1 GiB in memory; cap it like a small host would
    mem_limit: 2g
    read_only: true            # the app never writes to disk
    tmpfs:
      - /tmp
    restart: unless-stopped

  # Optional: the app behind nginx with default proxy buffering on, to check that the
  # SSE replay still streams through a reverse proxy.  docker compose --profile proxy up
  proxy:
    profiles: ["proxy"]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
